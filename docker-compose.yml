version: '3'

services:
  bot:
    container_name: jmelody
    build:
      context: .
    tty: true
    env_file:
      - stack.env
    links:
      - redis
    depends_on:
      - redis
    networks:
      - jmelody-network


  redis:
    container_name: jmelody-redis
    image: redis:alpine
    tty: true
    restart: always
    command: /bin/sh -c "redis-server --requirepass $$REDIS_HOST_PASSWORD"
    environment:
      - REDIS_HOST_PASSWORD=de8b7c40f7ad40119237612be96a758f
    ports:
      - "6379:6379"
    networks:
      - jmelody-network


  rabbitmq:
    image: rabbitmq:4-management
    container_name: jmelody-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: jmelody
      RABBITMQ_DEFAULT_PASS: de8b7c40f7ad40119237612be96a758f
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - jmelody-network


networks:
  jmelody-network:
    driver: bridge